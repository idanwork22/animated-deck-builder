<!doctype html>
<!--
  deck-skeleton.html - minimal runnable Animated Deck Builder deck.
  Copy this, grow it. It already has: 1920x1080 scaled stage, dark+bright palette
  switch, keyboard/clicker nav, notes overlay, presenter window, progress bar, and
  ONE animated slide (staged reveal + travel dot). Everything uses CSS variables so
  both themes work.

  To ship both themes from a build script, render this twice swapping only the
  :root block (see the two blocks marked DARK / BRIGHT below) and write deck.html
  and "deck bright.html". For a quick hand-authored deck, keep DARK and add a
  toggle, or just duplicate the file.

  Fonts: this skeleton uses system "Segoe UI"/Helvetica as a stand-in. For the real
  look, embed Amazon Ember as base64 @font-face (see build_html.py font_face()).
-->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck skeleton</title>
<style>
/* ---- DARK palette (default). For BRIGHT, replace this one :root block. ---- */
:root{
  --bg:#0B1220;--panel:#131C2E;--panel2:#0E1628;--grid:#24324A;
  --txt:#F8FAFC;--txt2:#CBD5E1;--mut:#94A3B8;--overlay:rgba(11,18,32,.96);--letterbox:#000;
  --green:#3DDC84;--orange:#FF9900;--blue:#60A5FA;--red:#F87171;--amber:#FBBF24;--purple:#C084FC;--ink:#0B1220;
}
/* ---- BRIGHT palette (swap in to build the bright file) ----
:root{
  --bg:rgb(228,230,234);--panel:#FFFFFF;--panel2:#EEF1F6;--grid:#C3CCD9;
  --txt:#0B1220;--txt2:#334155;--mut:#5B6B82;--overlay:rgba(236,239,243,.97);--letterbox:#C7CCD3;
  --green:#3DDC84;--orange:#FF9900;--blue:#60A5FA;--red:#F87171;--amber:#FBBF24;--purple:#C084FC;--ink:#0B1220;
}
---- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--letterbox);overflow:hidden}
body{font-family:"Amazon Ember","Segoe UI",Helvetica,Arial,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased}
#deck{position:absolute;width:1920px;height:1080px;left:50%;top:50%;transform-origin:center center}
section{position:absolute;inset:0;background:var(--bg);padding:56px 90px 70px;display:flex;flex-direction:column;opacity:0;visibility:hidden}
body.ready section{transition:opacity .35s ease}
section.active{opacity:1;visibility:visible}
h1{font-size:78px;line-height:1.06;font-weight:800;letter-spacing:-1.5px}
.kicker{font-size:26px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px}
.green{color:var(--green)}.orange{color:var(--orange)}.blue{color:var(--blue)}.red{color:var(--red)}.amber{color:var(--amber)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:22px 0 28px}
.takeaway{font-size:46px;font-weight:800;letter-spacing:-.5px;text-align:center;padding-top:8px}
.footer{position:absolute;left:90px;right:90px;bottom:22px;display:flex;justify-content:space-between;font-size:22px;color:var(--grid);pointer-events:none;z-index:5}
#progress{position:absolute;left:0;bottom:0;height:6px;background:var(--green);transition:width .35s;z-index:6}
/* title */
.title{justify-content:center;padding-left:140px}
.title .hero{font-size:168px;margin:6px 0 10px;letter-spacing:-4px}
.title .sub{font-size:56px;color:var(--mut);font-weight:700}

/* ===== Animated slide: staged reveal + a dot travelling a path ===== */
.flow{display:flex;align-items:center;gap:0;width:1300px}
.node{flex:0 0 300px;height:200px;background:var(--panel);border:2px solid var(--grid);border-radius:22px;
  display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:var(--txt);
  opacity:0;transform:translateY(24px)}
.pipe{flex:1;height:6px;background:var(--grid);position:relative;border-radius:3px;opacity:0}
.pipe .dot{position:absolute;top:50%;left:0;width:26px;height:26px;margin-top:-13px;border-radius:50%;
  background:var(--green);box-shadow:0 0 22px var(--green)}
/* staged reveal: children animate in on a stagger when .play is toggled */
.flow.play .node{animation:fadeUp .5s ease forwards}
.flow.play .pipe{animation:fadeIn .4s ease .5s forwards}
.flow.play .node:nth-child(1){animation-delay:.05s}
.flow.play .node:nth-child(3){animation-delay:.6s}
.flow.play .node:nth-child(5){animation-delay:1.1s}
/* travel dot: setTimeout-free pure-CSS loop is fine for live; for HEADLESS capture
   drive .dot with a setTimeout loop in JS instead (rAF/CSS freeze in screenshots). */
.flow.play .dot{animation:travel 2.2s ease-in-out 1.3s infinite}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes travel{0%{left:0}100%{left:100%}}

/* notes + presenter */
#notes{position:fixed;left:0;right:0;bottom:0;max-height:45vh;overflow:auto;background:var(--overlay);
  border-top:3px solid var(--green);color:var(--txt);font:20px/1.5 "Amazon Ember",Arial;padding:18px 28px;white-space:pre-wrap;display:none;z-index:10}
#notes.on{display:block}
#hint{position:fixed;right:16px;top:12px;color:var(--mut);font:14px "Amazon Ember",Arial;z-index:10}
</style></head><body>
<div id="deck">
  <section class="title">
    <div class="kicker green">Your event</div>
    <h1 class="hero">Title here</h1>
    <div class="sub">One-line subtitle, no em dash</div>
  </section>

  <section class="content">
    <div class="kicker blue">How it moves</div>
    <h1>Data flows left to right</h1>
    <div class="stage">
      <div class="flow replay">
        <div class="node">Source</div>
        <div class="pipe"><span class="dot"></span></div>
        <div class="node">Stream</div>
        <div class="pipe"><span class="dot"></span></div>
        <div class="node">Sink</div>
      </div>
    </div>
    <div class="takeaway green">Read the log once, apply it exactly once.</div>
  </section>

  <div class="footer"><span>Your event &middot; Your talk</span><span id="num"></span></div>
  <div id="progress"></div>
</div>
<div id="notes"></div>
<div id="hint">F fullscreen &middot; N notes &middot; P presenter</div>
<script>
const NOTES = [
  "Title slide. Welcome, who you are, one sentence on why this talk.",
  "Trace the flow left to right. The dot is one change event moving to the sink."
];
const slides=[...document.querySelectorAll('#deck section')], N=slides.length;
let i=Math.min(Math.max((parseInt(location.hash.slice(1))||1)-1,0),N-1);
const deck=document.getElementById('deck'), notesEl=document.getElementById('notes'),
      prog=document.getElementById('progress'), num=document.getElementById('num');
const chan=('BroadcastChannel' in window)?new BroadcastChannel('deck'):null;
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);deck.style.transform=`translate(-50%,-50%) scale(${s})`}
function show(n,fromChan){i=Math.min(Math.max(n,0),N-1);
  slides.forEach((s,k)=>s.classList.toggle('active',k===i));
  // re-trigger staged animations on entry
  slides[i].querySelectorAll('.replay').forEach(e=>{e.classList.remove('play');void e.offsetWidth;e.classList.add('play')});
  notesEl.textContent=NOTES[i]||''; prog.style.width=((i+1)/N*100)+'%'; num.textContent=(i+1)+' / '+N;
  history.replaceState(null,'','#'+(i+1)); if(chan&&!fromChan)chan.postMessage({i});}
addEventListener('resize',fit);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(i+1)}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(i-1)}
  else if(e.key==='Home')show(0); else if(e.key==='End')show(N-1);
  else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='n'||e.key==='N')notesEl.classList.toggle('on');
  else if(e.key==='p'||e.key==='P')presenter();});
deck.addEventListener('click',()=>show(i+1));
if(chan)chan.onmessage=m=>{if(typeof m.data.i==='number'&&m.data.i!==i)show(m.data.i,true)};
function presenter(){
  const w=open('','deck-presenter','width=1200,height=800'); if(!w)return;
  w.document.write(`<html><head><title>Presenter</title><style>
   body{margin:0;background:#0B1220;color:#F8FAFC;font:20px/1.5 Arial;display:grid;grid-template-columns:1.2fr 1fr;
   grid-template-rows:auto 1fr;gap:14px;padding:16px;height:100vh;box-sizing:border-box}
   #t{grid-column:1/3;display:flex;gap:30px;align-items:center;font-size:34px;font-weight:bold}
   #t span{color:#3DDC84} #n{white-space:pre-wrap;overflow:auto;font-size:24px;background:#131C2E;padding:16px;border-radius:12px}
   #x{background:#131C2E;border-radius:12px;padding:16px} button{font-size:20px;padding:6px 14px}</style></head><body>
   <div id="t">Slide <span id="c"></span> &nbsp; Elapsed <span id="el">0:00</span> &nbsp;
   <button id="r">reset</button><button id="pv">&larr;</button><button id="nx">&rarr;</button></div>
   <div id="n"></div><div id="x"><h3>Next</h3><div id="xt"></div></div></body></html>`);
  w.document.close();
  const pc=new BroadcastChannel('deck'); let t0=Date.now();
  const titles=slides.map(s=>(s.querySelector('h1')||{}).textContent||'');
  function upd(k){w.document.getElementById('c').textContent=(k+1)+' / '+N;
    w.document.getElementById('n').textContent=NOTES[k]||'';
    w.document.getElementById('xt').textContent=k+1<N?titles[k+1]:'(end)';}
  pc.onmessage=m=>upd(m.data.i); upd(i);
  w.document.getElementById('r').onclick=()=>t0=Date.now();
  w.document.getElementById('nx').onclick=()=>pc.postMessage({i:Math.min(i+1,N-1)});
  w.document.getElementById('pv').onclick=()=>pc.postMessage({i:Math.max(i-1,0)});
  setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);
    w.document.getElementById('el').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500);
}
fit(); show(i); requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add('ready')));
setTimeout(()=>{const h=document.getElementById('hint');if(h)h.style.display='none'},6000);
</script>
</body></html>
